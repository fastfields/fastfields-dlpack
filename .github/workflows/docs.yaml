name: Docs

# Builds this repo's documentation and publishes it as the /dlpack/ section of
# the fastfields.github.io Pages site:
#
#     /          fastfields.github.io (landing page + shared theme)
#     /python/   fastfields
#     /dlpack/   here
#     /lib/      fastfields-lib
#     /whl/      whl -- its own project Pages site, independent
#
# This used to deploy with actions/deploy-pages to this repo's OWN Pages site,
# which served a second, diverging copy of these pages at
# fastfields.github.io/fastfields-dlpack/ while the /dlpack/ path the landing
# page links -- and every section's menu links -- was a 404. actions/deploy-pages
# cannot fix that: it only ever deploys to the repo it runs in, and it replaces
# the whole site, so it cannot express "four repos, one site". Hence the same
# subtree publish the other two sections use. See DOCS-THEME.md in
# fastfields/.github.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "fastfields/**"
      # The API page is rendered from the BUILT extension, whose docstrings
      # live in src/ext.cpp and whose build is pinned by fastfields-lib.sha, so
      # both of those change the published page. So do the doc toolchain pins:
      # the page's whole content comes out of mkdocstrings, so a change to
      # docs/requirements.txt can empty it on its own.
      - "src/**"
      - "fastfields-lib.sha"
      # ...and so does how the extension is built. `setup.py` decides the
      # compile and link of `_core` and `pyproject.toml` its dependencies, so
      # either can leave the extension unimportable -- which is the exact
      # failure that empties this page. They were missing from this list,
      # which is how the abi3/split-mode build change reached a review with
      # the API-page guard never run.
      - "setup.py"
      - "pyproject.toml"
      - "zensical.toml"
      - "docs/requirements.txt"
      - "tools/publish-docs.sh"
      - "tools/check-docs-nav.py"
      - "tools/check-api-page.py"
      - ".github/workflows/docs.yaml"
  # The checks below gate pull requests too -- that is the point of them, and
  # a page that only breaks after merge is the situation this is here to end.
  # `build-deploy` runs on pull requests as well; only its publish step is
  # push-only.
  #
  # The path list is repeated rather than shared with a YAML anchor: GitHub
  # Actions does not support anchors or aliases in workflow files.
  pull_request:
    paths:
      - "docs/**"
      - "fastfields/**"
      - "src/**"
      - "fastfields-lib.sha"
      # ...and so does how the extension is built. `setup.py` decides the
      # compile and link of `_core` and `pyproject.toml` its dependencies, so
      # either can leave the extension unimportable -- which is the exact
      # failure that empties this page. They were missing from this list,
      # which is how the abi3/split-mode build change reached a review with
      # the API-page guard never run.
      - "setup.py"
      - "pyproject.toml"
      - "zensical.toml"
      - "docs/requirements.txt"
      - "tools/publish-docs.sh"
      - "tools/check-docs-nav.py"
      - "tools/check-api-page.py"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

# Only read: the push into fastfields.github.io is authenticated by the
# DOCS_DEPLOY_KEY deploy key, not by this workflow's token, and nothing here
# writes to this repo. The `pages:`/`id-token:` grants the old
# actions/deploy-pages path needed are gone with it.
permissions:
  contents: read

jobs:
  # The top-level documentation menu is duplicated across four repositories --
  # zensical has no include mechanism -- and it drifted until no two sections
  # agreed on it. This job is the guard, and it has to run HERE, against THIS
  # repo's zensical.toml: a check living in only one repo cannot see another
  # repo's drift. The canonical list is in DOCS-THEME.md in fastfields/.github.
  #
  # It is a separate job from build-deploy on purpose: it needs no compiler, no
  # network fetch and no ~9-minute C++ build, so the menu is checked in seconds
  # even when the build below is slow or broken.
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # --selftest first: it checks the checker against known-good and
      # known-broken navs, so a check that has quietly stopped failing on
      # anything cannot pass for a working one.
      - run: python3 tools/check-docs-nav.py --selftest
      - run: python3 tools/check-docs-nav.py --check zensical.toml

  build-deploy:
    needs: nav
    runs-on: ubuntu-latest
    # Stops THIS repo racing itself when publishing. It is NOT the cross-repo
    # guard: concurrency groups are per-repository, so they cannot serialize
    # this job against the publishers in fastfields.github.io / fastfields /
    # fastfields-lib. Those races are handled by the retry loop in
    # tools/publish-docs.sh.
    #
    # A pull-request run builds and checks the site but never publishes, so it
    # must not sit in the publisher's queue: a few PR builds would otherwise
    # delay every push to main behind them. Hence a per-ref group for those.
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request'
        && format('docs-pr-{0}', github.ref)
        || 'publish-docs' }}
      cancel-in-progress: false
    steps:
      # No submodules and no token: the fastfields-lib C++ tree is pinned by
      # SHA in fastfields-lib.sha and fetched by `pip install .` below. (The
      # dead CI_SUBMODULE_TOKEN that used to be passed here was killing this
      # job in actions/checkout, before any pip step ran.)
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r docs/requirements.txt
      # This job needs a real `pip install .`, and the API reference is why.
      # docs/api/index.md is a heading plus `::: fastfields.dlpack`, and
      # fastfields/dlpack/__init__.py is 58 `name = _core.name` aliases whose
      # docstrings live in src/ext.cpp -- so every function on that page comes
      # out of the *compiled* extension, and mkdocstrings can only read it by
      # importing it. That is what `force_inspection = true` in zensical.toml
      # makes griffe do, and it is why this install is load-bearing: without a
      # built, importable `fastfields.dlpack._core`, the docs build FAILS.
      #
      # Until force_inspection was set, this comment was simply wrong, and had
      # been for as long as it existed. `paths = ["."]` pointed griffe at the
      # source tree instead, where `_core`'s attributes are unresolvable; it
      # emitted nothing for all 58 of them, did not warn, and the page went
      # live with its module heading, zero functions and an empty objects.inv
      # -- with this install step running and the build printing `No issues
      # found`. The install was not doing the job this comment credited it
      # with. It is now, and the empty-page failure mode is no longer silent:
      # tools/check-api-page.py below counts the rendered objects and fails the
      # build before anything is published.
      #
      # That install fetches the pinned fastfields-lib over the network -- the
      # one network dependency in this build. If it ever fails here, setup.py
      # prints the SHA it wanted, the URL, and the FASTFIELDS_DIR recipe for
      # supplying the tree locally; read that message rather than the traceback.
      #
      # The fetch is ~1s, but the C++ build it triggers is ~9 minutes. The
      # install above is what the API page is rendered from, so that build
      # cannot be skipped; caching it is the only thing that makes it
      # affordable, here and on the pull-request runs this job now also does.
      # The build is a pure function of the pinned commit and the compiler, so
      # the key is exactly that -- hashFiles() over the pin file. (That hashes
      # its comments too, so editing them discards the cache; over-
      # invalidating is the safe direction.)
      #
      # Deliberately no `restore-keys`: a near-miss would restore libraries
      # built from a *different* commit, and setup.py skips `make` whenever the
      # libraries are already present, so a fuzzy hit would silently link the
      # docs build against the wrong library. Only an exact hit may be used.
      # setup.py merges the fetched sources around a restored build/ directory.
      - uses: actions/cache@v4
        with:
          path: _fastfields_lib/build
          key: ff-lib-build-${{ runner.os }}-${{ hashFiles('fastfields-lib.sha') }}
      - run: pip install .
      - run: zensical build --clean

      # The guard on the step above. `zensical build` reports `No issues found`
      # and exits 0 when mkdocstrings renders an API page with nothing on it,
      # so the build's own exit status says nothing about whether the page has
      # any content. This counts the objects in the rendered HTML and fails
      # below a floor -- and it runs BEFORE the publish step, so an empty page
      # cannot reach fastfields.github.io even once.
      #
      # --selftest first, as in the nav job: it checks the checker against the
      # exact markup of the page that shipped empty and against a healthy one,
      # so a check that has quietly stopped failing on anything cannot pass
      # for a working one.
      - run: python3 tools/check-api-page.py --selftest
      - run: python3 tools/check-api-page.py --check site/api/index.html

      # The wanted path is /dlpack/, which differs from this repo's name, so
      # actions/deploy-pages cannot produce it: it only ever deploys to the
      # repo it runs in. The script writes ONLY `dlpack/` and cannot reach the
      # landing page or the other sections.
      #
      # Pushed over SSH as the DOCS_DEPLOY_KEY organization secret: the private
      # half of a deploy key registered on fastfields.github.io with write
      # access, scoped to this repo, fastfields and fastfields-lib. The default
      # GITHUB_TOKEN cannot be used -- it is scoped to the repo it runs in. The
      # script checks the secret is non-empty before doing any work and fails
      # with one line naming it if not.
      - name: Publish the DLPack section into fastfields.github.io
        # The build and the checks above run on pull requests; publishing does
        # not.
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: ./tools/publish-docs.sh --auth ssh --subdir dlpack --site site
