[project]
site_name = "fastfields"
site_description = "nanobind bindings from DLPack to the fastfields-lib C++ library (fastfields.dlpack)"
site_author = "Yaël Balbastre"
site_url = "https://fastfields.github.io/dlpack/"
repo_url = "https://github.com/fastfields/fastfields-dlpack"
repo_name = "fastfields/fastfields-dlpack"
copyright = "Copyright &copy; 2026 The fastfields authors"
# The shared theme. Served by the fastfields.github.io repo, referenced by
# absolute URL so the four sections look alike from one source -- and so no
# docs build has to fetch another repository.
extra_css = ["https://fastfields.github.io/stylesheets/extra.css"]
# The canonical fastfields menu: one entry per fastfields namespace, plus Home
# and the wheel index. The nine top-level entries, these labels and this order
# are identical in all four sections (see DOCS-THEME.md in the fastfields/.github
# repo) and tools/check-docs-nav.py fails the build if they drift. A section
# expands the entries it owns into its own pages and links the rest absolutely:
# a relative target keeps in-site navigation native (active-page highlight, no
# full page reload), an absolute one crosses to another section's site.
#
# `index.md` leads the group, so `navigation.indexes` makes the
# `fastfields.dlpack` entry itself land on this section's own description.
nav = [
  {"Home" = "https://fastfields.github.io/"},
  {"fastfields.auto" = "https://fastfields.github.io/python/auto/"},
  {"fastfields.numpy" = "https://fastfields.github.io/python/numpy/"},
  {"fastfields.torch" = "https://fastfields.github.io/python/torch/"},
  {"fastfields.cupy" = "https://fastfields.github.io/python/cupy/"},
  {"fastfields.helpers" = "https://fastfields.github.io/python/helpers/"},
  {"fastfields.dlpack" = [
    "index.md",
    {"CUDA" = "cuda.md"},
    {"API reference" = "api/index.md"},
  ]},
  {"libfastfields" = "https://fastfields.github.io/lib/"},
  {"Wheel index" = "https://fastfields.github.io/whl/"},
]
[project.theme]
language = "en"
features = ["content.code.copy", "content.code.select", "navigation.indexes"]
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
[project.theme.icon]
logo = "fontawesome/solid/spiral"
repo = "fontawesome/brands/github"
[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
]
paths = ["."]
[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
merge_init_into_class = true
separate_signature = true
members_order = "source"
show_root_heading = true
show_if_no_docstring = false
filters = "public"
show_signature_annotations = true
signature_crossrefs = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.toc]
toc_depth = 3
