[build-system]
# nanobind >= 3.1 for split mode: `NB_BACKEND_MODULE` and the
# `nanobind-backend` distribution it imports do not exist before it, and
# an older nanobind would compile a linked extension that is not abi3.
requires = ["setuptools>=64", "wheel", "nanobind>=3.1", "numpy", "versioningit>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfields-dlpack"
description = "nanobind bindings from DLPack to the fastfields-lib C++ library (fastfields.dlpack)"
readme = "README.md"
# 3.10 is nanobind's limited-API floor, not a policy choice: nb_defs.h
# #errors for `Py_LIMITED_API < 0x030A0000`. One `cp310-abi3` wheel then
# covers every CPython from here up, so this floor is also the only
# Python version the release matrix builds on.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
maintainers = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
keywords = ["fastfields", "medical-imaging", "interpolation", "distance-transform", "gpu", "dlpack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    # `packaging` parses __version__ to expose the compute backend as
    # `fastfields.dlpack.backend` (see fastfields/dlpack/__init__.py).
    "packaging",
    # A RUNTIME dependency, not a build one, and the price of the single abi3
    # wheel. `_core` is built in nanobind's split mode: it carries no copy of
    # libnanobind and imports `nanobind_backend` from this distribution during
    # PyInit__core, so without it the extension does not import at all.
    # `nanobind` itself stays in [build-system].requires -- only its headers
    # are needed to compile. See the split-mode block in setup.py.
    "nanobind-backend",
]

[project.optional-dependencies]
test = ["numpy", "pytest"]

# Explicit single-package listing: only the ``fastfields.dlpack`` subpackage is
# shipped. Crucially, no ``fastfields/__init__.py`` is created or packaged, so
# ``fastfields`` stays a PEP 420 native namespace package that other
# distributions (fastfields-numpy, fastfields-torch, fastfields-cupy,
# fastfields) can merge into.
[tool.setuptools]
packages = ["fastfields.dlpack"]

[tool.setuptools.package-data]
"fastfields.dlpack" = ["lib/*.so", "lib/*.dylib", "lib/*.dll"]

[tool.ruff]
line-length = 79
# `_fastfields_lib` is the fetched C++ source tree, not our code: it appears in
# the working tree as soon as the package is built once, and it has Python of
# its own under tools/ that follows its own conventions.
extend-exclude = ["docs/examples", "_fastfields_lib"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = [
    "B007",   # allow unused loop variables
    "E731",   # allow assigning lambdas to variables
]

[project.urls]
Homepage = "https://github.com/fastfields/fastfields-dlpack"
Documentation = "https://fastfields.github.io/dlpack/"
Issues = "https://github.com/fastfields/fastfields-dlpack/issues"
Repository = "https://github.com/fastfields/fastfields-dlpack"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

# The compute backend is stamped into the PEP 440 local version identifier
# (PyTorch convention: 0.0.0.dev1+cpu), driven by $FF_WHEEL_VARIANT at build
# time. Both steps are custom because versioningit skips `format` entirely when
# the checkout is exactly at a tag -- which is precisely the release case -- so
# the label has to be applied in `tag2version`, and `format` then exists only
# to fold the variant and the distance suffix into the single local segment
# PEP 440 allows. See _versioning.py for the full rationale.
[tool.versioningit.tag2version]
module = "_versioning"
value = "tag2version"

[tool.versioningit.format]
module = "_versioning"
value = "format"

[tool.versioningit.write]
file = "fastfields/dlpack/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fastfields.dlpack"]
omit = ["*/_version.py"]

[tool.codespell]
check-filenames = true
# `_fastfields_lib` is skipped for the same reason ruff excludes it: it is the
# fetched fastfields-lib tree, spelled upstream and checked by its own CI
# (which has its own .codespellrc, including the vendored dlpack.h exemption).
skip = ".git,*.egg-info,build,dist,*.pdf,*.svg,docs/examples,_fastfields_lib"
